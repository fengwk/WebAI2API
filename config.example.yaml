# 日志等级: debug | info | warn | error
logLevel: info

server:
  # 监听端口
  port: 3000
  # 内置鉴权已移除，如需访问控制请通过前置网关处理。
  # 当脚本通过 helper 输出 URL 文件时，拼接外部可访问地址的基准 URL。
  # 例如部署在反代前缀 /proxy/gpt-image 下时，可配置为：
  # https://gpt-load.kk1.fun/proxy/gpt-image
  # 留空时返回站内相对路径 /files/...
  publicFileBaseUrl: ""
  # WebUI 中 curl 示例使用的外部 API 基准地址。
  # 例如 WebUI 走内网访问，但希望复制出的 curl 指向公网域名时可配置：
  # https://webai2api.kk1.fun
  # 留空时使用当前打开 WebUI 的页面 origin。
  publicApiBaseUrl: ""

backend:
  # ========================================
  # Pool 配置
  # ========================================
  pool:
    # 全局调度策略:
    # - least_busy (推荐): 优先分配给当前任务最少的 Worker
    # - round_robin: 轮询分配 (A -> B -> C -> A)
    # - random: 随机分配
    # 任务分发时，会把所有 Instance 下的所有 Worker 扁平化看待
    strategy: least_busy

    # ========================================
    # 故障转移配置
    # ========================================
    # 当适配器返回网络错误时，自动尝试其他支持相同模型的 Worker
    failover:
      enabled: true           # 启用故障转移
      maxRetries: 2           # 最多重试次数 (0=无限制)

    # ========================================
    # 默认执行超时
    # ========================================
    # 单次脚本执行过程中的默认等待超时，单位毫秒
    # 脚本内部仍可为具体步骤单独设置局部 timeout
    waitTimeout: 120000

    # ========================================
    # 浏览器实例列表
    # ========================================
    # 每个 Instance 代表一个独立的浏览器进程 (Context + UserData + Proxy)
    # 登录模式:
    #   npm start -- -login              启动第一个 Worker 进行登录
    #   npm start -- -login=workerName   启动指定名称的 Worker 进行登录
    # 注意: Worker 名称在全局必须唯一
    # ========================================
    instances:
      # ------------------------------------------------
      # [实例 1] 默认浏览器实例
      # ------------------------------------------------
      - name: "browser_default"        # 实例 ID (用于日志显示和Cookie获取)
        # userDataMark 不设置时，数据存放在 data/camoufoxUserData
        # 同一实例下的所有 Worker 共享浏览器数据和登录状态
        # 使用 Google OAuth 等统一登录时，只需登录一次即可用于所有 Worker
        
        # 该浏览器实例具备的能力 (动态适配器列表)
        # 相当于为同一套登录态/代理配置挂载不同站点脚本
        # type 必须填写 data/adapters/*.js 中 manifest.id
        workers:
          - name: "default"            # 唯一标识 (用于登录模式和日志显示)
            # 动态适配器示例:
            #   chatgpt
            #   gemini
            type: chatgpt

      # ------------------------------------------------
      # 以下为多实例配置示例 (默认注释)
      # ------------------------------------------------
      
      # [实例 2] 独立数据目录 + 专属代理
      # - name: "browser_us_01"
      #   userDataMark: "us_01"        # 数据目录: data/camoufoxUserData_us_01
      #   
      #   # 实例级代理 (该实例下所有 Worker 共享此代理)
      #   proxy:
      #     enable: true
      #     type: socks5
      #     host: 192.168.1.10
      #     port: 1080
      #     user: myuser               # 可选认证
      #     passwd: mypassword
      #
      #   workers:
      #     - name: "us_lmarena"
      #       type: lmarena
      #     
      #     - name: "us_zai"
      #       type: zai_is
      #     
      # [实例 3] 强制直连 (不使用代理)
      # - name: "browser_direct"
      #   userDataMark: "direct"
      #   proxy:
      #     enable: false              # 即使有全局代理也不使用
      #
      #   workers:
      #     - name: "direct_gemini"
      #       type: gemini_biz

queue:
  # 全局入口缓冲区大小（非流式请求的额外排队数）
  # 设为 0 则不限制全局入口排队数量
  # 实际队列上限 = Workers数量 + queueBuffer
  queueBuffer: 2

  # 单个 worker 的本地等待队列上限
  # 请求已经绑定到某个 worker（显式指定 workerId 或调度选中）后，
  # 若该 worker 当前正在执行，则请求会进入该 worker 的本地 FIFO 队列。
  # 超过该值时直接返回 busy。
  workerMaxPending: 10

  # 单个请求在目标 worker 本地队列中的最长等待时间（毫秒）
  # 超时后返回 timeout。
  workerWaitTimeout: 300000

browser:
  # 浏览器可执行文件路径 (留空则使用默认的)
  # 非必要不建议修改，否则你要处理很多额外依赖
  # Windows系统示例 "C:\\camoufox\\camoufox.exe"
  # Linux系统示例 "/opt/camoufox/camoufox"
  path: ""
  
  # 是否启用无头模式
  headless: false

  # 拟人鼠标轨迹模式
  # - false:  禁用拟人轨迹，使用 Playwright 原生点击（性能最好，但会被自动化检测）
  # - true:   使用项目优化的 ghost-cursor（更拟人化，如不会点击正中心，但性能稍差）
  # - "camou": 使用 Camoufox 内置轨迹（性能与拟人化的平衡）
  humanizeCursor: true

  # 站点隔离 (fission.autostart)
  # 开启保持 Firefox 默认开启状态
  # 关闭此项可显著降低内存占用，防止低配服务器崩溃
  # ⚠️ 风险提示: 正常 Firefox 用户默认开启 Fission，虽然关闭它不会泄露常规指纹，
  # 但极高阶的反爬系统可能会通过检测“单进程模型”或“跨进程通信延迟”来识别自动化特征！
  fission: true

  # CSS 性能优化注入
  # 通过禁用网页特效在无显卡环境下降低 CPU 压力
  cssInject:
    # 禁用网页动画
    # 作用：移除 transition 和 animation
    # 收益：显著降低 CPU 持续占用
    # 风险：低。几乎不影响浏览器指纹，但可能导致部分网页布局异常
    animation: false

    # 禁用滤镜和阴影
    # 作用：移除 blur(模糊)、box-shadow(阴影) 等复杂渲染
    # 收益：在无显卡环境下，能避免 CPU 占用 100% 导致卡顿
    # 风险：中。界面会变得难看，少数反爬可能会检测样式计算结果
    filter: false

    # 降低字体渲染质量
    # 作用：关闭字体抗锯齿，强制使用极速渲染模式
    # 收益：微量减少 CPU 绘图压力
    # ⚠️ 风险：高。会导致文字边缘有锯齿，且可能导致字体指纹与标准浏览器不符（易被高级反爬识别）
    font: false

  # [全局代理] 如果 Instance 没有独立配置代理，将使用此配置
  proxy:
    # 是否启用代理
    enable: false
    # 代理类型: http 或 socks5
    type: http
    # 代理主机
    host: 127.0.0.1
    # 代理端口
    port: 7890
    # 代理认证 (可选)
    # user: username
    # passwd: password
